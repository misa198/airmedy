name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        type: string
      os:
        description: 'Target OS'
        required: true
        type: choice
        options: [all, macos, linux, windows]
        default: all
      arch:
        description: 'Target architecture'
        required: true
        type: choice
        options: [all, amd64, arm64]
        default: all

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    if: |
      (github.event.inputs.os == 'all' || github.event.inputs.os == matrix.os) &&
      (github.event.inputs.arch == 'all' || github.event.inputs.arch == matrix.arch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: amd64
            runner: macos-13
            task_prefix: darwin
            ext: ''
          - os: macos
            arch: arm64
            runner: macos-latest
            task_prefix: darwin
            ext: ''
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            task_prefix: linux
            ext: ''
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            task_prefix: linux
            ext: ''
          - os: windows
            arch: amd64
            runner: windows-latest
            task_prefix: windows
            ext: .exe
          - os: windows
            arch: arm64
            runner: windows-latest
            task_prefix: windows
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Zig (Windows arm64 cross-compiler)
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Build (standard)
        if: matrix.os != 'windows' || matrix.arch != 'arm64'
        shell: bash
        run: task ${{ matrix.task_prefix }}:build ARCH=${{ matrix.arch }}
        env:
          CGO_ENABLED: '1'

      - name: Build (Windows arm64 via Zig)
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        shell: bash
        run: task windows:build ARCH=arm64
        env:
          CGO_ENABLED: '1'
          CC: 'zig cc -target aarch64-windows-gnu'

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          mv "bin/airmedy${{ matrix.ext }}" \
             "dist/airmedy-${{ github.event.inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: airmedy-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: artifacts/**
