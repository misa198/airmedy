name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        type: string
      os:
        description: 'Target OS'
        required: true
        type: choice
        options: [all, macos, linux, windows]
        default: all
      arch:
        description: 'Target architecture'
        required: true
        type: choice
        options: [all, amd64, arm64]
        default: all

jobs:
  prepare:
    name: Compute matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - id: filter
        run: |
          OS="${{ github.event.inputs.os }}"
          ARCH="${{ github.event.inputs.arch }}"
          ALL='{"include":[
            {"os":"macos","arch":"amd64","runner":"macos-13","task_prefix":"darwin","ext":""},
            {"os":"macos","arch":"arm64","runner":"macos-latest","task_prefix":"darwin","ext":""},
            {"os":"linux","arch":"amd64","runner":"ubuntu-latest","task_prefix":"linux","ext":""},
            {"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm","task_prefix":"linux","ext":""},
            {"os":"windows","arch":"amd64","runner":"windows-latest","task_prefix":"windows","ext":".exe"}
          ]}'
          MATRIX=$(echo "$ALL" | jq -c --arg os "$OS" --arg arch "$ARCH" \
            '.include |= map(select(($os=="all" or .os==$os) and ($arch=="all" or .arch==$arch)))')
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$MATRIX" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74

      # ── Linux ───────────────────────────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev

      - name: Build (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: wails3 task linux:build ARCH=${{ matrix.arch }}
        env:
          CGO_ENABLED: '1'

      # ── macOS ───────────────────────────────────────────────────────────
      - name: Build (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: wails3 task darwin:build ARCH=${{ matrix.arch }}
        env:
          CGO_ENABLED: '1'

      # ── Windows amd64 (MSYS2 MinGW64 + FFmpeg static) ──────────────────
      - name: Install Windows amd64 dependencies via MSYS2
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
        run: pacman -S --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-ffmpeg

      - name: Build (Windows amd64)
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        shell: C:\msys64\usr\bin\bash.exe -eo pipefail {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          cd "${{ github.workspace }}"
          export PATH="/mingw64/bin:$PATH"
          export CC=gcc
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig"
          wails3 task windows:build ARCH=amd64

      # ── Artifact ────────────────────────────────────────────────────────
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          mv "bin/airmedy${{ matrix.ext }}" \
             "dist/airmedy-${{ github.event.inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: airmedy-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  release:
    name: Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: artifacts/**
