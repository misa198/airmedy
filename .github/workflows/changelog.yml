name: Publish Changelog

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, or all to backfill every published release
        required: false
        default: all
        type: string

concurrency:
  group: publish-changelog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout master with tags
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Test changelog generation
        run: node --test scripts/publish-changelog.test.cjs

      - name: Publish changelogs and update release notes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await require('./scripts/publish-changelog.cjs')({
              github,
              context,
              tag: process.env.RELEASE_TAG,
            })
