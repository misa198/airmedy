name: Bump Landing Download Version

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      target:
        description: Download target to update
        required: true
        type: choice
        options:
          - desktop
          - mobile

concurrency:
  group: landing-download-version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Read released version from master
        id: version
        run: |
          if [[ "${{ inputs.target }}" == mobile ]]; then
            VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' mobile/androidApp/build.gradle.kts)
            TARGET=mobile
          else
            VERSION=$(sed -nE '/^info:/,/^[^[:space:]]/ s/^[[:space:]]+version: "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' build/config.yml)
            TARGET=desktop
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Bump landing download version
        run: bash scripts/bump-download-version.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.target }}"

      - name: Commit landing download version
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/master' })
            const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.data.object.sha })
            const blob = await github.rest.git.createBlob({
              owner,
              repo,
              content: fs.readFileSync('public/static/config.json').toString('base64'),
              encoding: 'base64',
            })
            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parent.data.tree.sha,
              tree: [{ path: 'public/static/config.json', mode: '100644', type: 'blob', sha: blob.data.sha }],
            })
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: `chore: bump landing download version to ${process.env.VERSION}`,
              tree: tree.data.sha,
              parents: [parent.data.sha],
            })
            await github.rest.git.updateRef({ owner, repo, ref: 'heads/master', sha: commit.data.sha, force: false })
