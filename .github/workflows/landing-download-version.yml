name: Bump Landing Download Version

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Update the desktop download version
        required: false
        type: boolean
        default: false
      mobile:
        description: Update the Android download version
        required: false
        type: boolean
        default: false

concurrency:
  group: landing-download-version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Test download publication logic
        run: node --test scripts/publish-download-versions.test.cjs

      - name: Publish download versions and release manifest
        uses: actions/github-script@v7
        env:
          UPDATE_DESKTOP: ${{ inputs.desktop }}
          UPDATE_MOBILE: ${{ inputs.mobile }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const publish = require('./scripts/publish-download-versions.cjs')
            await publish({
              github,
              context,
              desktop: process.env.UPDATE_DESKTOP === 'true',
              mobile: process.env.UPDATE_MOBILE === 'true',
            })
