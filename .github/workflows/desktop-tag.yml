name: Desktop Tag

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g., 0.0.15)"
        required: true
        type: string

concurrency:
  group: tag-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Bump version to ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Bump app version
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/bump-version.sh "$VERSION"

      - name: Create verified bump commit and tag
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs')
            const version = process.env.VERSION
            const files = [
              'build/config.yml',
              'build/darwin/Info.dev.plist',
              'build/darwin/Info.plist',
              'build/linux/nfpm/nfpm.yaml',
              'build/linux/org.wails.airmedy.metainfo.xml',
              'build/windows/info.json',
              'build/windows/nsis/wails_tools.nsh',
              'build/windows/wails.exe.manifest',
              'frontend/package.json',
              'internal/app/config/meta.go',
            ]
            const { owner, repo } = context.repo
            const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/master' })
            const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.data.object.sha })
            const tree = []

            for (const path of files) {
              const blob = await github.rest.git.createBlob({
                owner,
                repo,
                content: fs.readFileSync(path).toString('base64'),
                encoding: 'base64',
              })
              tree.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha })
            }

            const updatedTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parent.data.tree.sha,
              tree,
            })
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: `chore: bump version to ${version}`,
              tree: updatedTree.data.sha,
              parents: [parent.data.sha],
            })
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/master',
              sha: commit.data.sha,
              force: false,
            })
            const tag = await github.rest.git.createTag({
              owner,
              repo,
              tag: `v${version}`,
              message: `Release v${version}`,
              object: commit.data.sha,
              type: 'commit',
            })
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/v${version}`,
              sha: tag.data.sha,
            })
