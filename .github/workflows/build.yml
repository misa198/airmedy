name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # A merged PR creates a push to master. Unlike pull_request: closed, this is
  # a trusted trigger and can populate the default branch's cache scope.
  push:
    branches:
      - master
    paths-ignore:
      - 'mobile/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ffmpeg-windows:
    name: Build FFmpeg for Windows
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

      - name: Cache FFmpeg (Windows)
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: internal/infra/audio/ffmpeg_libs
          key: ffmpeg-Windows-v3-${{ hashFiles('scripts/build-ffmpeg-windows.sh') }}

      - name: Install mingw cross-compilers
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 nasm
          # Ubuntu's gcc-mingw-w64-x86-64 leaves the compiler as an unconfigured
          # update-alternatives symlink (posix vs win32 threading model); pin it
          # explicitly or `x86_64-w64-mingw32-gcc` resolves but fails to run.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          # Windows ARM64 has no apt mingw package; llvm-mingw provides
          # aarch64-w64-mingw32-* (clang-based) cross-compilers.
          LLVM_MINGW=llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64
          curl -L "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/${LLVM_MINGW}.tar.xz" -o /tmp/llvm-mingw.tar.xz
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt
          echo "/opt/${LLVM_MINGW}/bin" >> "$GITHUB_PATH"

      - name: Build FFmpeg (Windows AMD64 + ARM64)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-windows.sh

      - name: Upload FFmpeg libs
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: internal/infra/audio/ffmpeg_libs

  build-fftw3-windows:
    name: Build FFTW3 for Windows
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

      - name: Cache FFTW3 (Windows)
        id: cache-fftw3
        uses: actions/cache@v4
        with:
          path: |
            internal/infra/audio/fftw3_libs/windows
            internal/infra/audio/fftw3_libs/include
            internal/infra/audio/fftw3_libs/pkgconfig/windows
          key: fftw3-Windows-v1-${{ hashFiles('scripts/build-fftw3-windows.sh') }}

      - name: Install mingw cross-compilers
        if: steps.cache-fftw3.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 make
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          LLVM_MINGW=llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64
          curl -L "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/${LLVM_MINGW}.tar.xz" -o /tmp/llvm-mingw.tar.xz
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt
          echo "/opt/${LLVM_MINGW}/bin" >> "$GITHUB_PATH"

      - name: Build FFTW3 (Windows AMD64 + ARM64)
        if: steps.cache-fftw3.outputs.cache-hit != 'true'
        run: bash scripts/build-fftw3-windows.sh

      - name: Upload FFTW3 libs
        uses: actions/upload-artifact@v4
        with:
          name: fftw3-windows
          path: internal/infra/audio/fftw3_libs

  build-aubio-windows:
    name: Build aubio for Windows
    needs: build-fftw3-windows
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

      - name: Cache aubio (Windows)
        id: cache-aubio
        uses: actions/cache@v4
        with:
          path: internal/infra/audio/aubio_libs
          key: aubio-Windows-v2-${{ hashFiles('scripts/build-aubio-windows.sh') }}

      - name: Download FFTW3 (Windows)
        if: steps.cache-aubio.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: fftw3-windows
          path: internal/infra/audio/fftw3_libs

      - name: Install mingw cross-compilers
        if: steps.cache-aubio.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 python3 pkg-config
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          LLVM_MINGW=llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64
          curl -L "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/${LLVM_MINGW}.tar.xz" -o /tmp/llvm-mingw.tar.xz
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt
          echo "/opt/${LLVM_MINGW}/bin" >> "$GITHUB_PATH"

      - name: Build aubio (Windows AMD64 + ARM64)
        if: steps.cache-aubio.outputs.cache-hit != 'true'
        run: bash scripts/build-aubio-windows.sh

      - name: Upload aubio config.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aubio-windows-config-log
          path: /tmp/aubio-build-airmedy-windows/work-*/build/config.log

      - name: Upload aubio libs
        uses: actions/upload-artifact@v4
        with:
          name: aubio-windows
          path: internal/infra/audio/aubio_libs

  build-sfb-darwin:
    name: Build SFBAudioEngine for Darwin
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

      - name: Cache SFB Audio Engine (Darwin)
        id: cache-sfb
        uses: actions/cache@v4
        with:
          path: |
            internal/infra/audio/sfb_libs
            internal/infra/audio/sfb_build
          key: sfb-Darwin-v1-${{ hashFiles('scripts/build-sfbaudioengine-darwin.sh') }}

      - name: Build SFB Audio Engine (Darwin)
        if: steps.cache-sfb.outputs.cache-hit != 'true'
        run: bash scripts/build-sfbaudioengine-darwin.sh

  build-ffmpeg-darwin:
    name: Build FFmpeg for Darwin
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

      - name: Cache FFmpeg (Darwin)
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: internal/infra/audio/ffmpeg_libs
          key: ffmpeg-Darwin-v2-${{ hashFiles('scripts/build-ffmpeg-darwin.sh') }}

      - name: Install nasm
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: brew install nasm

      - name: Build FFmpeg (Darwin ARM64 + AMD64)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-darwin.sh all

      - name: Upload FFmpeg libs
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-darwin
          path: internal/infra/audio/ffmpeg_libs

  build-fftw3-darwin:
    name: Build FFTW3 for Darwin
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

      - name: Cache FFTW3 (Darwin)
        id: cache-fftw3
        uses: actions/cache@v4
        with:
          path: |
            internal/infra/audio/fftw3_libs/darwin
            internal/infra/audio/fftw3_libs/include
            internal/infra/audio/fftw3_libs/pkgconfig/darwin
          key: fftw3-Darwin-v1-${{ hashFiles('scripts/build-fftw3-darwin.sh') }}

      - name: Build FFTW3 (Darwin ARM64 + AMD64)
        if: steps.cache-fftw3.outputs.cache-hit != 'true'
        run: bash scripts/build-fftw3-darwin.sh all

      - name: Upload FFTW3 libs
        uses: actions/upload-artifact@v4
        with:
          name: fftw3-darwin
          path: internal/infra/audio/fftw3_libs

  build-aubio-darwin:
    name: Build aubio for Darwin
    needs: build-fftw3-darwin
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

      - name: Cache aubio (Darwin)
        id: cache-aubio
        uses: actions/cache@v4
        with:
          path: internal/infra/audio/aubio_libs
          key: aubio-Darwin-v2-${{ hashFiles('scripts/build-aubio-darwin.sh') }}

      - name: Download FFTW3 (Darwin)
        if: steps.cache-aubio.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: fftw3-darwin
          path: internal/infra/audio/fftw3_libs

      - name: Install pkg-config
        if: steps.cache-aubio.outputs.cache-hit != 'true'
        run: brew install pkg-config

      - name: Build aubio (Darwin ARM64 + AMD64)
        if: steps.cache-aubio.outputs.cache-hit != 'true'
        run: bash scripts/build-aubio-darwin.sh all

      - name: Upload aubio libs
        uses: actions/upload-artifact@v4
        with:
          name: aubio-darwin
          path: internal/infra/audio/aubio_libs

  build-ffmpeg-linux:
    name: Build FFmpeg for Linux
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

      - name: Cache FFmpeg (Linux)
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: internal/infra/audio/ffmpeg_libs
          key: ffmpeg-Linux-v2-${{ hashFiles('scripts/build-ffmpeg-linux.sh') }}

      - name: Install Linux cross-compile dependencies
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config

      - name: Build FFmpeg (Linux AMD64 + ARM64)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-linux.sh

      - name: Upload FFmpeg libs
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux
          path: internal/infra/audio/ffmpeg_libs

  build-fftw3-linux:
    name: Build FFTW3 for Linux
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

      - name: Cache FFTW3 (Linux)
        id: cache-fftw3
        uses: actions/cache@v4
        with:
          path: |
            internal/infra/audio/fftw3_libs/linux
            internal/infra/audio/fftw3_libs/include
            internal/infra/audio/fftw3_libs/pkgconfig/linux
          key: fftw3-Linux-v1-${{ hashFiles('scripts/build-fftw3-linux.sh') }}

      - name: Install Linux cross-compile dependencies
        if: steps.cache-fftw3.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config

      - name: Build FFTW3 (Linux AMD64 + ARM64)
        if: steps.cache-fftw3.outputs.cache-hit != 'true'
        run: bash scripts/build-fftw3-linux.sh

      - name: Upload FFTW3 libs
        uses: actions/upload-artifact@v4
        with:
          name: fftw3-linux
          path: internal/infra/audio/fftw3_libs

  build-aubio-linux:
    name: Build aubio for Linux
    needs: build-fftw3-linux
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

      - name: Cache aubio (Linux)
        id: cache-aubio
        uses: actions/cache@v4
        with:
          path: internal/infra/audio/aubio_libs
          key: aubio-Linux-v2-${{ hashFiles('scripts/build-aubio-linux.sh') }}

      - name: Download FFTW3 (Linux)
        if: steps.cache-aubio.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: fftw3-linux
          path: internal/infra/audio/fftw3_libs

      - name: Install Linux cross-compile dependencies
        if: steps.cache-aubio.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config

      - name: Build aubio (Linux AMD64 + ARM64)
        if: steps.cache-aubio.outputs.cache-hit != 'true'
        run: bash scripts/build-aubio-linux.sh

      - name: Upload aubio libs
        uses: actions/upload-artifact@v4
        with:
          name: aubio-linux
          path: internal/infra/audio/aubio_libs

  build:
    name: Build ${{ matrix.os }}
    needs: [build-ffmpeg-windows, build-fftw3-windows, build-aubio-windows, build-sfb-darwin, build-ffmpeg-darwin, build-fftw3-darwin, build-aubio-darwin, build-ffmpeg-linux, build-fftw3-linux, build-aubio-linux]
    strategy:
      fail-fast: false
      matrix:
        os:
          - Windows-AMD64
          - Windows-ARM64
          - Linux-AMD64
          - Linux-ARM64
          - Darwin-AMD64
          - Darwin-ARM64
    runs-on: ${{ (contains(matrix.os, 'Windows') && 'windows-latest') || (contains(matrix.os, 'Darwin') && 'macos-26') || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create secrets.go
        shell: bash
        run: |
          cat <<EOF > internal/app/config/secrets.go
          package config

          var (
          	LastFmAPIKey    = "${{ secrets.LASTFM_API_KEY }}"
          	LastFmAPISecret = "${{ secrets.LASTFM_API_SECRET }}"
          )
          EOF

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          if [[ "${{ matrix.os }}" == "Linux-ARM64" ]]; then
            sudo dpkg --add-architecture arm64
            # Update existing sources to be amd64 only to avoid 404s on mirrors that don't have arm64
            if [ -f /etc/apt/sources.list ]; then
              sudo sed -i 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
            fi
            if ls /etc/apt/sources.list.d/*.sources 1> /dev/null 2>&1; then
              sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64/g' /etc/apt/sources.list.d/*.sources
            fi
            # Add Ubuntu Ports for arm64
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          fi
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev build-essential nsis gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config qemu-user-static binfmt-support

      - name: Install Windows Dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (15 * $attempt)
          }
          (Get-ChildItem 'C:\Program Files*\NSIS\makensis.exe' | Select-Object -First 1).DirectoryName | Add-Content -Path $env:GITHUB_PATH

      - name: Setup MSYS2 (Windows AMD64)
        if: matrix.os == 'Windows-AMD64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: false

      - name: Setup llvm-mingw (Windows ARM64)
        if: matrix.os == 'Windows-ARM64'
        shell: pwsh
        run: |
          # CLANGARM64 toolchain ships arm64-hosted binaries that can't run on
          # the x86_64 runner. llvm-mingw is x86_64-hosted and cross-targets
          # aarch64-w64-mingw32, matching the ARM64 FFmpeg libs.
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\llvm-mingw.zip" -DestinationPath "C:\"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\llvm-mingw-20260616-ucrt-x86_64\bin"

      - name: Cache Miniaudio (Windows and Linux)
        id: cache-miniaudio
        if: runner.os == 'Windows' || runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: internal/infra/audio/miniaudio
          key: miniaudio-${{ runner.os }}-${{ hashFiles('scripts/fetch-miniaudio.sh') }}

      - name: Download FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: internal/infra/audio/ffmpeg_libs

      - name: Download aubio (Windows)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: aubio-windows
          path: internal/infra/audio/aubio_libs

      - name: Download FFTW3 (Windows)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: fftw3-windows
          path: internal/infra/audio/fftw3_libs

      - name: Download FFmpeg (Darwin)
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-darwin
          path: internal/infra/audio/ffmpeg_libs

      - name: Download aubio (Darwin)
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: aubio-darwin
          path: internal/infra/audio/aubio_libs

      - name: Download FFTW3 (Darwin)
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: fftw3-darwin
          path: internal/infra/audio/fftw3_libs

      - name: Restore SFB Audio Engine (Darwin)
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v4
        with:
          path: |
            internal/infra/audio/sfb_libs
            internal/infra/audio/sfb_build
          key: sfb-Darwin-v1-${{ hashFiles('scripts/build-sfbaudioengine-darwin.sh') }}

      - name: Download FFmpeg (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-linux
          path: internal/infra/audio/ffmpeg_libs

      - name: Download aubio (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: aubio-linux
          path: internal/infra/audio/aubio_libs

      - name: Download FFTW3 (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: fftw3-linux
          path: internal/infra/audio/fftw3_libs

      - name: Fetch miniaudio (Windows and Linux)
        if: (runner.os == 'Windows' || runner.os == 'Linux') && steps.cache-miniaudio.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/fetch-miniaudio.sh

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.9

      - name: Install Linux ARM64 Cross-compile Dependencies
        if: runner.os == 'Linux' && matrix.os == 'Linux-ARM64'
        run: |
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" --no-install-recommends libgtk-3-dev:arm64 libwebkit2gtk-4.1-dev:arm64 libgtk-4-dev:arm64 libwebkitgtk-6.0-dev:arm64

      - name: Build and Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          REPO_ROOT=$(pwd)
          export CGO_ENABLED=1
          export CGO_CFLAGS="-I${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/include"
          # MinGW C++/pthread runtime is statically linked via cgoflags_windows_*.go
          # (-Wl,-Bstatic -lstdc++ -lpthread), so no -static-libstdc++ env flag is needed here.
          if [[ "${{ matrix.os }}" == "Windows-ARM64" ]]; then
            export GOOS=windows
            export GOARCH=arm64
            # x86_64-hosted llvm-mingw cross-compiler for aarch64 Windows.
            # CXX must be the arm64-targeted wrapper too: Go links the C++ cgo
            # objects with g++, and the unprefixed g++ defaults to the x64 host
            # target (=> "machine type arm64 conflicts with x64").
            export CC=aarch64-w64-mingw32-clang
            export CXX=aarch64-w64-mingw32-g++
            export CGO_LDFLAGS="-L${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/windows/arm64"
            task windows:package ARCH=arm64
          else
            export GOOS=windows
            export GOARCH=amd64
            export CC=gcc
            export CGO_LDFLAGS="-L${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/windows/amd64"
            task windows:package ARCH=amd64
          fi

      - name: Build and Package (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          REPO_ROOT=$(pwd)
          export CGO_CFLAGS="-I${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/include"

          OS_INPUT="${{ matrix.os }}"
          case $OS_INPUT in
            "Linux-AMD64")
              export CGO_LDFLAGS="-L${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/linux/amd64"
              task linux:package ARCH=amd64
              ;;
            "Linux-ARM64")
              export CGO_LDFLAGS="-L${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/linux/arm64"
              export CC=aarch64-linux-gnu-gcc
              export CGO_ENABLED=1
              export GOARCH=arm64
              export GOOS=linux
              export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_ALLOW_CROSS=1
              task linux:package ARCH=arm64
              ;;
            "Darwin-AMD64")
              task darwin:package ARCH=amd64
              ;;
            "Darwin-ARM64")
              task darwin:package ARCH=arm64
              ;;
          esac

      - name: List bin directory
        shell: bash
        run: ls -la bin/ 2>/dev/null || echo "bin/ is empty or does not exist"

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          OS_INPUT="${{ matrix.os }}"
          VERSION="${{ steps.version.outputs.version }}"
          case $OS_INPUT in
            "Windows-AMD64")
              # Installer (zipped)
              INSTALLER=""
              if [ -f bin/airmedy-amd64-installer.exe ]; then
                INSTALLER="bin/airmedy-amd64-installer.exe"
              else
                INSTALLER=$(find bin/ -name "*installer.exe" | head -1)
              fi
              if [ -n "$INSTALLER" ]; then
                if command -v zip >/dev/null 2>&1; then
                  zip -j dist/Airmedy_${VERSION}_windows-amd64_installer.zip "$INSTALLER"
                else
                  7z a dist/Airmedy_${VERSION}_windows-amd64_installer.zip "$INSTALLER"
                fi
              else
                echo "No windows installer found"
              fi
              ;;
            "Windows-ARM64")
              # Installer (zipped)
              INSTALLER=""
              if [ -f bin/airmedy-arm64-installer.exe ]; then
                INSTALLER="bin/airmedy-arm64-installer.exe"
              else
                INSTALLER=$(find bin/ -name "*installer.exe" | head -1)
              fi
              if [ -n "$INSTALLER" ]; then
                if command -v zip >/dev/null 2>&1; then
                  zip -j dist/Airmedy_${VERSION}_windows-arm64_installer.zip "$INSTALLER"
                else
                  7z a dist/Airmedy_${VERSION}_windows-arm64_installer.zip "$INSTALLER"
                fi
              else
                echo "No windows arm64 installer found"
              fi
              ;;
            "Linux-AMD64")
              # System packages
              DEB=$(find bin/ -name "*.deb" | head -1)
              RPM=$(find bin/ -name "*.rpm" | head -1)
              PKG=$(find bin/ -name "*.pkg.tar.zst" | head -1)
              if [ -n "$DEB" ]; then cp "$DEB" dist/Airmedy_${VERSION}_linux-amd64.deb; else echo "No .deb found"; fi
              if [ -n "$RPM" ]; then cp "$RPM" dist/Airmedy_${VERSION}_linux-amd64.rpm; else echo "No .rpm found"; fi
              if [ -n "$PKG" ]; then cp "$PKG" dist/Airmedy_${VERSION}_linux-amd64.pkg.tar.zst; else echo "No .pkg.tar.zst found"; fi
              # Standalone binary for auto-update
              if [ -f bin/airmedy ]; then
                cd bin && tar -czf ../dist/Airmedy_${VERSION}_linux-amd64.tar.gz airmedy && cd ..
              fi
              ;;
            "Linux-ARM64")
              # System packages
              DEB=$(find bin/ -name "*.deb" | head -1)
              RPM=$(find bin/ -name "*.rpm" | head -1)
              PKG=$(find bin/ -name "*.pkg.tar.zst" | head -1)
              if [ -n "$DEB" ]; then cp "$DEB" dist/Airmedy_${VERSION}_linux-arm64.deb; else echo "No .deb found"; fi
              if [ -n "$RPM" ]; then cp "$RPM" dist/Airmedy_${VERSION}_linux-arm64.rpm; else echo "No .rpm found"; fi
              if [ -n "$PKG" ]; then cp "$PKG" dist/Airmedy_${VERSION}_linux-arm64.pkg.tar.zst; else echo "No .pkg.tar.zst found"; fi
              # Standalone binary for auto-update
              if [ -f bin/airmedy ]; then
                cd bin && tar -czf ../dist/Airmedy_${VERSION}_linux-arm64.tar.gz airmedy && cd ..
              fi
              ;;
            "Darwin-AMD64"|"Darwin-ARM64")
              PLATFORM=$(echo ${OS_INPUT} | tr '[:upper:]' '[:lower:]')
              cd bin
              zip -r ../dist/Airmedy_${VERSION}_${PLATFORM}.zip airmedy.app
              ;;
          esac

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
