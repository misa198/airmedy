name: Build and Release

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target Operating System'
        required: true
        default: 'Windows-AMD64'
        type: choice
        options:
          - Windows-AMD64
          - Linux-AMD64
          - Linux-ARM64
          - Darwin-AMD64
          - Darwin-ARM64
      version:
        description: 'Tag version (e.g., 1.0.0)'
        required: true
      prerelease:
        description: 'Create as Pre-release'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build ${{ github.event.inputs.os }}
    runs-on: ${{ (contains(github.event.inputs.os, 'Windows') && 'windows-latest') || (contains(github.event.inputs.os, 'Darwin') && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          if [[ "${{ github.event.inputs.os }}" == "Linux-ARM64" ]]; then
            sudo dpkg --add-architecture arm64
            # Update existing sources to be amd64 only to avoid 404s on mirrors that don't have arm64
            if [ -f /etc/apt/sources.list ]; then
              sudo sed -i 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
            fi
            if ls /etc/apt/sources.list.d/*.sources 1> /dev/null 2>&1; then
              sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64/g' /etc/apt/sources.list.d/*.sources
            fi
            # Add Ubuntu Ports for arm64
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          fi
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential nsis nasm gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-nsis
            make
            diffutils
            pkg-config

      - name: Add MSYS2 to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH

      - name: Install Darwin Dependencies
        if: runner.os == 'Darwin'
        run: brew install nasm

      - name: Cache FFmpeg Binaries
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: internal/infra/audio/ffmpeg_libs
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg-*') }}

      - name: Build FFmpeg (Linux)
        if: runner.os == 'Linux' && steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-linux.sh

      - name: Build FFmpeg (Darwin)
        if: runner.os == 'Darwin' && steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-darwin.sh

      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-windows.sh

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.78

      - name: Install Linux ARM64 Cross-compile Dependencies
        if: runner.os == 'Linux' && github.event.inputs.os == 'Linux-ARM64'
        run: |
          sudo apt-get install -y -o Dpkg::Options::="--force-overwrite" --no-install-recommends libgtk-3-dev:arm64 libwebkit2gtk-4.1-dev:arm64

      - name: Update Version in Config
        shell: bash
        run: |
          # Update build/config.yml
          sed 's/version: "[^"]*"/version: "${{ github.event.inputs.version }}"/' build/config.yml > build/config.yml.tmp && mv build/config.yml.tmp build/config.yml
          # Update build/linux/nfpm/nfpm.yaml
          if [ -f build/linux/nfpm/nfpm.yaml ]; then
            sed 's/version: "[^"]*"/version: "${{ github.event.inputs.version }}"/' build/linux/nfpm/nfpm.yaml > build/linux/nfpm/nfpm.yaml.tmp && mv build/linux/nfpm/nfpm.yaml.tmp build/linux/nfpm/nfpm.yaml
          fi

      - name: Build and Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          REPO_ROOT=$(cygpath -w "$(pwd)")
          export CC=$(cygpath -w "$(which gcc)")
          export CGO_CFLAGS="-I${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/include"
          export CGO_LDFLAGS="-L${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/windows/amd64 -lncrypt -lcrypt32 -lbcrypt -lsecur32"
          task windows:package ARCH=amd64

      - name: Build and Package (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          REPO_ROOT=$(pwd)
          export CGO_CFLAGS="-I${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/include"

          OS_INPUT="${{ github.event.inputs.os }}"
          case $OS_INPUT in
            "Linux-AMD64")
              export CGO_LDFLAGS="-L${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/linux/amd64"
              task linux:package ARCH=amd64
              ;;
            "Linux-ARM64")
              export CGO_LDFLAGS="-L${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/linux/arm64"
              export CC=aarch64-linux-gnu-gcc
              export CGO_ENABLED=1
              export GOARCH=arm64
              export GOOS=linux
              export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_ALLOW_CROSS=1
              task linux:package ARCH=arm64
              ;;
            "Darwin-AMD64")
              export CGO_LDFLAGS="-L${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/darwin/amd64"
              task darwin:package ARCH=amd64
              ;;
            "Darwin-ARM64")
              export CGO_LDFLAGS="-L${REPO_ROOT}/internal/infra/audio/ffmpeg_libs/darwin/arm64"
              task darwin:package ARCH=arm64
              ;;
          esac

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist
          OS_INPUT="${{ github.event.inputs.os }}"
          VERSION="${{ github.event.inputs.version }}"
          case $OS_INPUT in
            "Windows-AMD64")
              if [ -f bin/airmedy-amd64-installer.exe ]; then
                cp bin/airmedy-amd64-installer.exe dist/Airmedy_${VERSION}_windows-amd64.exe
              else
                cp bin/*installer.exe dist/Airmedy_${VERSION}_windows-amd64.exe || echo "No windows installer found"
              fi
              ;;
            "Linux-AMD64")
              cp bin/airmedy_${VERSION}_amd64.deb dist/Airmedy_${VERSION}_linux-amd64.deb || cp bin/*.deb dist/
              ;;
            "Linux-ARM64")
              cp bin/airmedy_${VERSION}_arm64.deb dist/Airmedy_${VERSION}_linux-arm64.deb || cp bin/*.deb dist/
              ;;
            "Darwin-AMD64"|"Darwin-ARM64")
              PLATFORM=$(echo ${OS_INPUT} | tr '[:upper:]' '[:lower:]')
              cd bin
              zip -r ../dist/Airmedy_${VERSION}_${PLATFORM}.zip airmedy.app
              ;;
          esac

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
