name: Mobile Tag

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New mobile version (e.g., 0.0.2)"
        required: true
        type: string

concurrency:
  group: tag-mobile-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Bump mobile version to ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Bump mobile version
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/bump-mobile-version.sh "$VERSION"

      - name: Create verified bump commit and tag
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs')
            const version = process.env.VERSION
            const { owner, repo } = context.repo
            const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/master' })
            const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.data.object.sha })
            const blob = await github.rest.git.createBlob({
              owner,
              repo,
              content: fs.readFileSync('mobile/androidApp/build.gradle.kts').toString('base64'),
              encoding: 'base64',
            })
            const updatedTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parent.data.tree.sha,
              tree: [{ path: 'mobile/androidApp/build.gradle.kts', mode: '100644', type: 'blob', sha: blob.data.sha }],
            })
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: `chore(mobile): bump version to ${version}`,
              tree: updatedTree.data.sha,
              parents: [parent.data.sha],
            })
            await github.rest.git.updateRef({ owner, repo, ref: 'heads/master', sha: commit.data.sha, force: false })
            const tag = await github.rest.git.createTag({
              owner,
              repo,
              tag: `mobile-v${version}`,
              message: `Mobile release v${version}`,
              object: commit.data.sha,
              type: 'commit',
            })
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/mobile-v${version}`, sha: tag.data.sha })
