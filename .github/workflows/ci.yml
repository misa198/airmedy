name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# actions/cache save needs a writable token scope; without this the restricted
# default GITHUB_TOKEN yields "cache write denied: token has no writable scopes".
permissions:
  contents: read
  actions: write

jobs:
  ci:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config nasm cmake

      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.112

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.5.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Create Dummy secrets.go
        run: |
          mkdir -p internal/app/config
          cat <<EOF > internal/app/config/secrets.go
          package config
          var (
            LastFmAPIKey    = "dummy"
            LastFmAPISecret = "dummy"
          )
          EOF

      # Native deps use restore + explicit save (not the combined cache action):
      # this job builds the frontend, lints, and runs tests after these steps,
      # and cancel-in-progress cancels the run on the next push. The combined
      # action only saves in a post-job step, so a later failure/cancel would
      # discard a freshly built lib and rebuild it every trigger. Saving right
      # after each build persists the lib as soon as it exists.
      - name: Restore FFmpeg (Linux)
        id: cache-ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: internal/infra/audio/ffmpeg_libs
          key: ffmpeg-linux-v3-${{ hashFiles('scripts/build-ffmpeg-linux.sh') }}

      - name: Build FFmpeg (Linux)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-linux.sh

      - name: Save FFmpeg (Linux)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: internal/infra/audio/ffmpeg_libs
          key: ffmpeg-linux-v3-${{ hashFiles('scripts/build-ffmpeg-linux.sh') }}

      - name: Restore Miniaudio (Linux)
        id: cache-miniaudio
        uses: actions/cache/restore@v4
        with:
          path: internal/infra/audio/miniaudio
          key: miniaudio-linux-${{ hashFiles('scripts/fetch-miniaudio.sh') }}

      - name: Fetch miniaudio (Linux)
        if: steps.cache-miniaudio.outputs.cache-hit != 'true'
        run: bash scripts/fetch-miniaudio.sh

      - name: Save Miniaudio (Linux)
        if: steps.cache-miniaudio.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: internal/infra/audio/miniaudio
          key: miniaudio-linux-${{ hashFiles('scripts/fetch-miniaudio.sh') }}

      - name: Restore aubio (Linux)
        id: cache-aubio
        uses: actions/cache/restore@v4
        with:
          path: internal/infra/audio/aubio_libs
          key: aubio-linux-v2-${{ hashFiles('scripts/build-aubio-linux.sh') }}

      - name: Build aubio (Linux)
        if: steps.cache-aubio.outputs.cache-hit != 'true'
        run: bash scripts/build-aubio-linux.sh amd64

      - name: Save aubio (Linux)
        if: steps.cache-aubio.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: internal/infra/audio/aubio_libs
          key: aubio-linux-v2-${{ hashFiles('scripts/build-aubio-linux.sh') }}

      - name: Install JS Dependencies
        run: pnpm install

      - name: Generate Bindings
        run: wails3 task common:generate:bindings

      - name: Build Frontend
        working-directory: frontend
        run: pnpm build

      - name: Build Remote
        working-directory: remote
        run: pnpm build

      - name: Go Lint
        run: wails3 task lint:go

      - name: Go Test
        run: wails3 task test:go

      - name: JS Lint
        run: wails3 task lint:js

      - name: Frontend Test
        run: wails3 task test:ui

      - name: Build Backend (Server Mode)
        run: wails3 task build:server
