# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "airmedy"
arch: ${GOARCH}
platform: "linux"
version: "0.1.2"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "An offline music player for macOS, Windows and Linux."
vendor: "misa198"
homepage: "https://airmedy.netlify.app"
license: "MIT"
release: "1"

contents:
  - src: "./bin/airmedy"
    dst: "/usr/local/bin/airmedy"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/airmedy.png"
  # Desktop file basename MUST match the runtime app_id (org.wails.airmedy, set
  # by Wails as org.wails.<name>) so the desktop environment links the window to
  # this entry and shows the correct dock/taskbar icon.
  - src: "./build/linux/org.wails.airmedy.desktop"
    dst: "/usr/share/applications/org.wails.airmedy.desktop"
  # AppStream MetaInfo: app centers read this for the publisher, license,
  # "last updated" date, content rating and project links.
  - src: "./build/linux/org.wails.airmedy.metainfo.xml"
    dst: "/usr/share/metainfo/org.wails.airmedy.metainfo.xml"

# Default dependencies for modern Linux distros (GTK4 + WebKit 6.0)
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides
overrides:
  # RPM packages
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
      - gtk4
      - webkitgtk6.0
  
  # Arch Linux packages
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

